<body>

<!-- NAVBAR -->
  <div id="navbarInclude"></div>
<!-- CONTACT FORM -->
<section class="contact-hero">
  <div class="seo-headings">
  <h1>Contact Your Personal Concierge in Istanbul</h1>
<h2>Tell Us What You Need</h2>
  </div>
  <div class="contact-form-wrapper">

    <div class="contact-form-header">
      <div class="contact-form-title">Private Concierge Request</div>
      <div class="contact-form-subline">Discreet • Tailored • Exceptional</div>
    </div>

    <div id="formInlineAlert"></div>

    <form
      id="contactForm"
      method="POST"
      novalidate
    >

<fieldset class="contact-choice-fieldset">
        <legend>Preferred Contact Method</legend>
        <div class="contact-radio-options">
          <label class="contact-radio-option"><input type="radio" name="contactMethod" value="WhatsApp" required><span>WhatsApp</span></label>
          <label class="contact-radio-option"><input type="radio" name="contactMethod" value="Email" required><span>E-mail</span></label>
        </div>
      </fieldset>



      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label>Phone Number (Preferred WhatsApp)</label>
        <input type="tel" id="phone" name="phone" required inputmode="tel" autocomplete="tel" maxlength="18" value="+" placeholder="+90 ...">
      </div>

      <div class="form-group">
        <label>Subject</label>
        <select id="subject" name="subject" required>
          <option value="" selected disabled>Select a subject</option>
          <option value="Airport Transfer">Airport Transfer</option>
          <option value="Meet &amp; Greet">Meet &amp; Greet</option>
          <option value="Private Tours">Private Tours</option>
          <option value="Restaurant Reservation">Restaurant Reservation</option>
          <option value="Hotel Reservation">Hotel Reservation</option>
          <option value="Turkish Hammam">Turkish Hammam</option>
          <option value="Internet &amp; eSIM">Internet &amp; eSIM</option>
          <option value="Private Chauffeur">Private Chauffeur</option>
          <option value="Bosphorus &amp; Yacht">Bosphorus &amp; Yacht</option>
          <option value="VIP Assistance">VIP Assistance</option>
          <option value="General Concierge">General Concierge</option>
          <option value="Event Organization">Event Organization</option>
          <option value="Other">Other</option>
        </select>
      </div>

<div class="form-group">
  <label>Request Details</label>
  <div class="textarea-wrapper">
    <textarea id="message" name="message" maxlength="2000"
      placeholder="Tell us what you need. If relevant, include dates, times, number of guests, preferred location and any special requests."></textarea>
  </div>
</div>

      <input type="hidden" name="referrer" value="contact-page">

      <p class="contact-form-note">We’ll review your request, check availability and pricing with the relevant provider, and contact you with the confirmed options and next steps.</p>

      <button type="submit" class="submit-btn">
        Send Your Request
      </button>

    </form>
  </div>
</section>

<!-- WHATSAPP -->
<a href="https://wa.me/905344888624" class="whatsapp-fixed" target="_blank" title="Chat with Concierge on WhatsApp">
  <img src="assets/whatsapp.png" alt="WhatsApp">
</a>

<script src="js/common.js"></script>
